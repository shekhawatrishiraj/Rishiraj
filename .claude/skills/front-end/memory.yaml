  # ── Infinite Scroll / Pagination (learned 2026-02-25) ──
  infinite_scroll:
    module_ref:
      context: "src/app/people/page.tsx"
    summary: "Debugging infinite scroll took 13min due to 3 stacked bugs. Log decisions to avoid repeat."

    pitfall_1_zero_height_sentinel:
      issue: "IntersectionObserver reports isIntersecting:false for zero-height elements"
      symptom: "Sentinel div with no height/content never triggers observer callback"
      fix: "Always give sentinel elements a minimum height: className='h-px'"
      rule: "Never use a zero-height div as an IntersectionObserver target"

    pitfall_2_unstable_array_refs:
      issue: ".filter() returns a new array reference every render"
      symptom: "useEffect([items]) reset fires every render, resetting visibleCount to PAGE_SIZE"
      fix: "Wrap filtered arrays in useMemo with stable dependencies (data source + query string)"
      rule: "Any array passed to useEffect deps or custom hooks must be memoized"
      example: |
        # BAD — new ref every render
        const filtered = data.filter(...)
        useInfiniteScroll(filtered, enabled)

        # GOOD — stable ref
        const filtered = useMemo(() => data.filter(...), [data, query])
        useInfiniteScroll(filtered, enabled)

    pitfall_3_observer_chaining:
      issue: "IntersectionObserver fires once on entry; if sentinel stays visible after batch load, no re-fire"
      symptom: "First batch loads, then stops — 'Loading more' stuck forever"
      approaches_tried:
        - name: "visibleCount in effect deps"
          result: "Failed — observer still doesn't re-fire on same-position element"
        - name: "Callback ref + sentinelKey forcing remount"
          result: "Failed — zero-height bug masked the fix"
        - name: "requestAnimationFrame + getBoundingClientRect"
          result: "Works — chains reliably by scheduling next check inside setVisibleCount callback"
      winning_pattern: |
        useEffect(() => {
          const check = () => {
            const rect = sentinelRef.current?.getBoundingClientRect();
            if (rect && rect.top < window.innerHeight + 300) {
              setVisibleCount(prev => {
                const next = Math.min(prev + PAGE_SIZE, items.length);
                if (next < items.length) requestAnimationFrame(check);  // chain
                return next;
              });
            }
          };
          rafRef.current = requestAnimationFrame(check);
          window.addEventListener("scroll", onScroll, { passive: true });
          return () => { window.removeEventListener("scroll", onScroll); cancelAnimationFrame(rafRef.current); };
        }, [enabled, items.length]);

    decision_log:
      - decision: "Use scroll events + rAF instead of IntersectionObserver"
        reason: "IO has edge cases with zero-height elements and doesn't re-fire when element stays visible"
        tradeoff: "Slightly more scroll event overhead, but simpler mental model and reliable chaining"
      - decision: "PAGE_SIZE = 20 cards per batch"
        reason: "3 cards per row × ~7 rows = fills viewport. Not too many to cause jank, not too few to feel slow"
      - decision: "300px look-ahead threshold"
        reason: "Start loading before user reaches bottom — feels seamless. 200px was too tight on 1080p"
      - decision: "Only enable infinite scroll for volume=heavy"
        reason: "Typical (29 people) and sparse (4 people) don't need pagination overhead"