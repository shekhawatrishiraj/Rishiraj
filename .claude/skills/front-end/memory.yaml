# QA Skill Memory
# Purpose: Persistent learning storage for /qa skill
# Usage: Skill reads before each run, writes after completion

schema_version: "1.1.0"
last_updated: "2026-01-27T15:35:00"

# ─────────────────────────────────────────────────────────────
# LEARNINGS INDEX
# Structured to mirror Rules/ and design-knowledge/ modules
# ─────────────────────────────────────────────────────────────

learnings:
  # ── Core (Rules/core.md + design-knowledge/core.md) ──
  core_tokens:
    module_ref:
      rules: "Rules/core.md"
      knowledge: "design-knowledge/core.md"
    spacing:
      common_issues:
        - "Arbitrary px values in margin/padding"
        - "Hardcoded gap values"
      quick_fix: "Replace with --spacing-{n} token"
      detection: "grep -rn 'margin:\\s*[0-9]' --include='*.tsx'"
    colors:
      common_issues:
        - "Hex codes in JSX"
        - "Hardcoded rgba values"
      quick_fix: "Replace with CSS custom properties using theme() tokens"
      detection: "grep -rn '#[0-9a-fA-F]\\{3,6\\}' --include='*.tsx'"
    radius:
      common_issues:
        - "Hardcoded border-radius"
      quick_fix: "Replace with --radius-{n} token"
      detection: "grep -rn 'border-radius:\\s*[0-9]' --include='*.tsx'"

  # ── Typography (Rules/typography.md + design-knowledge/typography.md) ──
  typography:
    module_ref:
      rules: "Rules/typography.md"
      knowledge: "design-knowledge/typography.md"
    common_issues:
      - "Headings missing text-balance"
      - "Body text missing text-pretty"
      - "Tables without tabular-nums"
      - "Custom letter-spacing"
    quick_fix: "Add text-balance/text-pretty, use tabular-nums in tables"
    detection: "grep -rn 'tracking-\\|letter-spacing:' --include='*.tsx'"

  # ── Motion (Rules/motion.md + design-knowledge/motion.md) ──
  motion:
    module_ref:
      rules: "Rules/motion.md"
      knowledge: "design-knowledge/motion.md"
    common_issues:
      - "Unapproved @keyframes animations"
      - "Animating layout properties (width, height)"
      - "Custom easing without approval"
      - "Missing prefers-reduced-motion"
    quick_fix: "Use transitions only, animate transform/opacity, honor reduced-motion"
    detection: "grep -rn '@keyframes\\|cubic-bezier' --include='*.css'"

  # ── Icons (Rules/icons.md) ──
  icons:
    module_ref:
      rules: "Rules/icons.md"
      knowledge: null
    common_issues:
      - "Wrong icon library (heroicons, feather)"
      - "Incorrect icon sizes"
      - "Missing aria-label on icon buttons"
    quick_fix: "Import from lucide-react, use 16/20/24px (size-4/size-5/size-6)"
    detection: "grep -rn 'heroicons\\|feather' --include='*.tsx'"

  # ── Mobile (Rules/mobile.md) ──
  mobile:
    module_ref:
      rules: "Rules/mobile.md"
      knowledge: null
    common_issues:
      - "Touch targets under 44px"
      - "Multi-column forms on mobile"
      - "Using h-screen instead of h-dvh"
      - "Missing safe-area-inset"
    quick_fix: "44px min touch, single-col forms, h-dvh, safe-area-inset"
    detection: "grep -rn 'h-screen' --include='*.tsx'"

  # ── States (Rules/states.md + design-knowledge/states.md) ──
  states:
    module_ref:
      rules: "Rules/states.md"
      knowledge: "design-knowledge/states.md"
    common_issues:
      - "Missing hover/focus states"
      - "No loading state"
      - "Empty state not implemented"
      - "Edge cases not considered (0, 1, 100+ items)"
    quick_fix: "Add Tailwind state utilities (hover:, focus:, disabled:)"
    detection: "grep -rn 'hover:\\|focus:\\|disabled:' --include='*.tsx'"

  # ── Forms (Rules/forms.md + design-knowledge/forms.md) ──
  forms:
    module_ref:
      rules: "Rules/forms.md"
      knowledge: "design-knowledge/forms.md"
    common_issues:
      - "Validation only on submit"
      - "Errors not inline with fields"
      - "Multi-column layout on mobile"
    quick_fix: "Real-time validation, inline errors, single column"
    detection: null

  # ── Modals (Rules/modals.md + design-knowledge/modals.md) ──
  modals:
    module_ref:
      rules: "Rules/modals.md"
      knowledge: "design-knowledge/modals.md"
    common_issues:
      - "Using modal when inline expansion better"
      - "Destructive actions without AlertDialog"
      - "Generic 'OK/Cancel' buttons"
    quick_fix: "Use AlertDialog for destructive, specific button labels"
    detection: null

  # ── Errors/Copy (Rules/errors.md + design-knowledge/copy.md) ──
  errors:
    module_ref:
      rules: "Rules/errors.md"
      knowledge: "design-knowledge/copy.md"
    common_issues:
      - "Generic error messages ('Invalid')"
      - "Errors far from action trigger"
      - "No recovery suggestion"
    quick_fix: "Specific errors inline, suggest next action"
    detection: null

  # ── Interactions (Rules/interactions.md) ──
  interactions:
    module_ref:
      rules: "Rules/interactions.md"
      knowledge: null
    common_issues:
      - "Blocking paste in inputs"
      - "Using h-screen instead of h-dvh"
      - "Fixed elements without safe-area-inset"
    quick_fix: "Never block paste, use h-dvh, add safe-area-inset"
    detection: "grep -rn 'onPaste.*preventDefault' --include='*.tsx'"

  # ── Accessibility (Rules/accessibility.md) ──
  accessibility:
    module_ref:
      rules: "Rules/accessibility.md"
      knowledge: null
    common_issues:
      - "Missing aria-labels on icon buttons"
      - "No focus indicators"
      - "Insufficient color contrast"
    quick_fix: "Add aria-label, ensure focus-visible styles, check contrast"
    detection: "grep -rn 'aria-label' --include='*.tsx' | wc -l"

  # ── Components (Rules/components.md + design-knowledge/system.md) ──
  components:
    module_ref:
      rules: "Rules/components.md"
      knowledge: "design-knowledge/system.md"
    common_issues:
      - "Modifying shadcn source"
      - "Mixing primitive systems"
      - "Not using existing project primitives"
    quick_fix: "Wrap shadcn, use project primitives"
    detection: null

  # ── CSS (Rules/css.md) ──
  css:
    module_ref:
      rules: "Rules/css.md"
      knowledge: null
    common_issues:
      - "Component-level CSS files"
      - "Inline styles"
      - "Using !important"
    quick_fix: "Move to globals.css, use Tailwind utilities"
    detection: "find . -name '*.module.css' -type f"

  # ── Skeleton / Loading States ──
  skeletons:
    module_ref:
      rules: "Rules/states.md"
      knowledge: "design-knowledge/states.md"
    visual_rules:
      background_color: "bg-muted-foreground/10"
      borders: "none — no border on skeleton elements"
      border_radius: "match real component (rounded-lg for cards, rounded-full for avatars)"
      animation: "animate-pulse (Tailwind default)"
    layout_rules:
      first_section: "1 skeleton card only"
      subsequent_sections: "6 skeleton cards"
      match_dimensions: "skeleton width/height must match real component dimensions exactly"
      tab_skeletons: "show skeleton tabs matching real tab count and width"
    decisions:
      - date: "2026-02-24"
        decision: "No borders on skeleton cards — cleaner appearance"
        rationale: "User feedback: bordered skeletons looked too busy and drew attention to empty structure"
      - date: "2026-02-24"
        decision: "bg-muted-foreground/10 instead of bg-muted for skeleton fill"
        rationale: "User feedback: bg-muted was too light, needed 'a little more grey' for visibility"
      - date: "2026-02-24"
        decision: "First section shows only 1 skeleton card"
        rationale: "User feedback: multiple skeletons in first section was visually overwhelming"

  # ── Design Constraints ──
  design:
    module_ref:
      rules: "Rules/core.md"
      knowledge: "design-knowledge/visual-perception.md"
    common_issues:
      - "Gradients without explicit request"
      - "Purple/multicolor gradients (AI anti-pattern)"
      - "Glow effects as primary affordances"
      - "Multiple accent colors per route"
    quick_fix: "No gradients unless requested, one accent per route"
    detection: "grep -rn 'bg-gradient\\|from-' --include='*.tsx'"

  # ── Hierarchy (design-knowledge/hierarchy.md) ──
  hierarchy:
    module_ref:
      rules: null
      knowledge: "design-knowledge/hierarchy.md"
    common_issues:
      - "Competing focal points"
      - "Multiple CTAs with equal weight"
      - "Important content below fold without earning scroll"
    quick_fix: "Clear visual hierarchy, primary action prominent"
    detection: null

  # ── Process (design-knowledge/process.md) ──
  process:
    module_ref:
      rules: null
      knowledge: "design-knowledge/process.md"
    common_issues:
      - "Happy path only design"
      - "Copying patterns without context"
      - "Optimizing for first impression over day-30"
    quick_fix: "Design unhappy path first, understand pattern context"
    detection: null

# ─────────────────────────────────────────────────────────────
# EFFECTIVE COMMANDS
# Commands that work well for detection
# ─────────────────────────────────────────────────────────────

commands:
  token_violations:
    hex_colors: "grep -rn '#[0-9a-fA-F]\\{3,6\\}' --include='*.tsx' --include='*.css'"
    arbitrary_margin: "grep -rn 'margin:\\s*[0-9]' --include='*.tsx'"
    arbitrary_padding: "grep -rn 'padding:\\s*[0-9]' --include='*.tsx'"
    hardcoded_radius: "grep -rn 'border-radius:\\s*[0-9]' --include='*.tsx' --include='*.css'"

  component_violations:
    inline_styles: "grep -rn 'style={{' --include='*.tsx'"
    component_css: "find . -name '*.module.css' -type f"
    wrong_icons: "grep -rn 'heroicons\\|feather' --include='*.tsx'"
    rounded_full_buttons: "grep -rn 'rounded-full' --include='*.tsx' | grep -i 'button\\|btn\\|Button'"
    raw_buttons_no_hover: "grep -rn '<button' --include='*.tsx' | grep -v 'hover:'"
    direct_tailwind_colors: "grep -rn 'bg-emerald\\|bg-red-\\|bg-blue-\\|bg-green-\\|text-emerald\\|text-red-\\|text-blue-\\|text-green-' --include='*.tsx'"
    custom_dropdown: "grep -rn 'click.*outside\\|mousedown.*contains\\|setOpen.*toggle' --include='*.tsx'"

  state_coverage:
    count_states: |
      for state in hover focus active disabled; do
        echo "$state: $(grep -rn "$state:" --include="*.tsx" | wc -l)"
      done

  accessibility:
    aria_count: "grep -rn 'aria-label\\|aria-describedby\\|role=' --include='*.tsx' | wc -l"
    focus_count: "grep -rn 'focus-visible\\|focus:' --include='*.tsx' | wc -l"

  typography:
    letter_spacing: "grep -rn 'tracking-\\|letter-spacing:' --include='*.tsx'"
    text_balance: "grep -rn 'text-balance' --include='*.tsx' | wc -l"
    tabular_nums: "grep -rn 'tabular-nums' --include='*.tsx' | wc -l"

  motion:
    keyframes: "grep -rn '@keyframes' --include='*.css'"
    custom_easing: "grep -rn 'cubic-bezier' --include='*.css'"
    reduced_motion: "grep -rn 'prefers-reduced-motion' --include='*.css' | wc -l"

  design:
    gradients: "grep -rn 'bg-gradient\\|from-' --include='*.tsx'"
    glows: "grep -rn 'shadow-.*glow\\|ring-.*glow' --include='*.tsx'"

  interactions:
    paste_blocking: "grep -rn 'onPaste.*preventDefault' --include='*.tsx'"
    h_screen: "grep -rn 'h-screen' --include='*.tsx'"

# ─────────────────────────────────────────────────────────────
# DECISIONS LOG
# Key decisions made during QA runs
# ─────────────────────────────────────────────────────────────

decisions:
  - date: "2026-02-23"
    component: "Agents Page (src/app/agents/page.tsx)"
    decision: "Use `persona === 'new-user'` check instead of `flags.isNewUser` for persona-based conditional rendering"
    rationale: "PersonaFlags type only has hasCompletedOnboarding, hasMeetings, hasConnections, hasKnowledgeSources — no isNewUser flag. Checking persona key directly is correct. The usePersona() hook returns { persona, flags, ... } where persona is the key string ('new-user' | 'returning')."
    module_ref: "Rules/states.md"
    alternatives_considered:
      - "Add isNewUser to PersonaFlags — adds redundant flag that duplicates persona key identity"
      - "Check flags.hasCompletedOnboarding === false — less explicit, could match other future personas"

  - date: "2026-02-23"
    component: "Meetings List, Recordings List (src/app/meetings/page.tsx)"
    decision: "Removed primary color hover on list item titles — rely on bg-accent/50 row highlight only"
    rationale: "User requested removal. Row-level bg-accent/50 hover + cursor:pointer provides sufficient clickability signal without title color change. Simpler interaction model."
    module_ref: "Rules/states.md"
    alternatives_considered:
      - "Keep text-primary title hover — removed per user request"
      - "Underline on hover — conflicts with global no-underline rule"

  - date: "2026-02-20"
    component: "Welcome Onboarding (connect-sources, social)"
    decision: "Use standard Input component with positioned icon instead of custom wrapper div around borderless Input"
    rationale: "Custom wrapper (div with border + borderless Input inside) creates inconsistent height and visual weight vs standard Input used elsewhere. Standard Input with pl-9 + absolute-positioned icon maintains h-9 across all inputs in the product."
    module_ref: "Rules/forms.md"
    alternatives_considered:
      - "Custom wrapper div with border + borderless Input — inconsistent height, shadow mismatch"
      - "InputGroup component — adds unnecessary abstraction for single icon"

  - date: "2026-02-20"
    component: "Welcome Onboarding (connect-sources)"
    decision: "shadow-none on Input and Button inside card to prevent nested shadow artifacts"
    rationale: "Input has shadow-xs by default. Inside a card with its own border, nested shadows create visual noise and break the flat hierarchy within the card."
    module_ref: "design-knowledge/visual-perception.md"
    alternatives_considered:
      - "Override at component level — affects all Inputs globally"
      - "Accept default shadows — creates density mismatch inside card"

  - date: "2026-01-27"
    component: "TwinDemo"
    decision: "Replaced all hex colors with CSS custom properties using design tokens"
    rationale: "Ensures consistency with design system and enables theming"
    module_ref: "Rules/core.md"
    alternatives_considered:
      - "Keep hex colors in constants object"
      - "Use Tailwind color classes directly"

  - date: "2026-01-27"
    component: "TwinDemo"
    decision: "Created separate CSS file with proper design tokens instead of inline styles"
    rationale: "Better maintainability, follows CSS-first approach, enables reuse"
    module_ref: "Rules/css.md"
    alternatives_considered:
      - "Convert to Tailwind classes"
      - "Keep minimal inline styles for dynamic values"

  - date: "2026-01-27"
    component: "TwinDemo"
    decision: "Added comprehensive accessibility attributes (aria-label, role)"
    rationale: "Ensures video is accessible for screen readers and assistive technology"
    module_ref: "Rules/accessibility.md"
    alternatives_considered:
      - "Add only basic aria-labels"
      - "Rely on semantic HTML only"

  - date: "2026-01-27"
    component: "TwinDemo"
    decision: "Enhanced message content to show realistic project context"
    rationale: "Demonstrates AI assistant's value for real business scenarios vs generic tech questions"
    module_ref: "design-knowledge/product.md"
    alternatives_considered:
      - "Keep original technical focus"
      - "Mix of technical and business content"

